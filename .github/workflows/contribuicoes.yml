name: contribuições

on:
  schedule:
    - cron: "23 9 * * *" # 06:23 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/contribuicoes.yml"]

permissions:
  contents: write

concurrency:
  group: contribuicoes
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Só biblioteca padrão do Python; lê commits públicos pela API de busca.
      - name: Gerar SVGs
        run: python3 tools/contribuicoes.py --user "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Branch órfão com um commit só, sobrescrito a cada execução: o histórico do main fica limpo.
      - name: Publicar no branch output
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "contribuicoes: $(date -u +%F)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
